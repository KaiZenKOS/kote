<!doctype html>
<html lang="fr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Koté — variantes couleur</title><style>@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap');*{box-sizing:border-box}body{margin:0;padding:60px 24px;background:#f5f7f5;color:#10231c;font-family:Manrope,Arial,sans-serif}.wrap{width:min(1100px,100%);margin:auto}.tag{font-size:10px;letter-spacing:.12em;color:#f45b20;font-weight:800}h1{font-size:clamp(42px,6vw,74px);line-height:.92;letter-spacing:-.08em;margin:14px 0 40px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{min-height:280px;padding:28px;border-radius:18px;display:flex;flex-direction:column;justify-content:space-between}.card img{width:74%;height:165px;object-fit:contain;object-position:left center}.card b{font-size:18px}.card span{display:block;margin-top:5px;font-size:13px;opacity:.7}.day{background:#fff}.night{background:#07110e;color:#f4faf7}.orange{background:#fff0e9}.blue{background:#eaf3ff}@media(max-width:680px){body{padding:38px 18px}.grid{grid-template-columns:1fr}.card{min-height:235px}}</style></head><body><main class="wrap"><span class="tag">KOTÉ / COULEURS</span><h1>Le même signe.<br/>Quatre contextes.</h1><section class="grid"><article class="card day"><img src="/images/kote-logo-standard.png" alt="Logo Koté original transparent"/><div><b>Signature</b><span>Orange + vert profond, fond clair.</span></div></article><article class="card night"><img src="/images/kote-logo-night.png" alt="Logo Koté nuit transparent"/><div><b>Nuit</b><span>Ambre + ivoire, pour le thème sombre.</span></div></article><article class="card orange"><img src="/images/kote-logo-orange.png" alt="Logo Koté orange transparent"/><div><b>Mono orange</b><span>Pour les appels à l’action et petits espaces.</span></div></article><article class="card blue"><img src="/images/kote-logo-blue.png" alt="Logo Koté bleu transparent"/><div><b>Mono bleu</b><span>Pour les surfaces de confiance et d’information.</span></div></article></section></main></body></html>
